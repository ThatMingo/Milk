name: Build oMLX Sidebar extension
on:
  push:
    branches:
      - build/omlx-sidebar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile native arm64 .milkext
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "arm64"
      - name: Build MilkExtensionKit author SDK only
        run: |
          swift build --package-path Packages/MilkExtensionKit --configuration debug
          SDK_BIN="$(swift build --package-path Packages/MilkExtensionKit --show-bin-path --configuration debug)"
          test -f "$SDK_BIN/libMilkExtensionKit.dylib"
          echo "MILK_EXTENSION_SDK=$SDK_BIN" >> "$GITHUB_ENV"
      - name: Unpack standalone extension
        run: |
          tar -xJf Tools/OMLXSidebar/source.tar.xz -C Tools/OMLXSidebar
          patch -d Tools/OMLXSidebar -p0 < Tools/OMLXSidebar/milk-theme.patch
          patch -d Tools/OMLXSidebar -p0 < Tools/OMLXSidebar/prefill-speed.patch
          python3 - <<'PY'
          from pathlib import Path
          import lzma
          root = Path("Tools/OMLXSidebar")
          patch_bytes = lzma.decompress((root / "sushi-support.patch.xz").read_bytes())
          # The original source archive predates its local test suite.
          patch_bytes = patch_bytes.split(b"--- Tests/TelemetryTests.swift\\n", 1)[0]
          (root / "sushi-support.patch").write_bytes(patch_bytes)
          PY
          patch -d Tools/OMLXSidebar -p0 < Tools/OMLXSidebar/sushi-support.patch
          python3 -c 'from pathlib import Path; p=Path("Tools/OMLXSidebar/manifest.json"); s=p.read_text(); assert '\''"version": "1.0.0"'\'' in s; p.write_text(s.replace('\''"version": "1.0.0"'\'', '\''"version": "1.0.3"'\''))'
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Tools/OMLXSidebar/manifest.json")
          s = p.read_text()
          s = s.replace('"name": "oMLX Dashboard"', '"name": "oMLX & Sushi Dashboard"')
          s = s.replace('Native SwiftUI oMLX dashboard in the Milk sidebar. Local automatic connection and read-only telemetry.', 'Native SwiftUI oMLX and Sushi dashboard in the Milk sidebar. Local automatic detection and read-only telemetry.')
          p.write_text(s)
          PY
          chmod +x Tools/OMLXSidebar/build.sh
      - name: Test oMLX and Sushi telemetry adapters
        run: |
          cd Tools/OMLXSidebar
          swiftc Telemetry.swift OMLXConfiguration.swift SushiSmokeTests.swift -o /tmp/omlx-sushi-tests
          /tmp/omlx-sushi-tests
      - name: Compile and ad-hoc sign extension
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          Tools/OMLXSidebar/build.sh
          BUNDLE="Tools/OMLXSidebar/build/OMLXSidebar.milkext"
          test -f "$BUNDLE/Contents/MacOS/OMLXSidebar"
          test -f "$BUNDLE/Contents/Resources/manifest.json"
          file "$BUNDLE/Contents/MacOS/OMLXSidebar"
          codesign --verify --verbose=2 "$BUNDLE"
      - name: Package installable extension
        run: |
          ditto -c -k --keepParent Tools/OMLXSidebar/build/OMLXSidebar.milkext OMLXSidebar.milkext.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OMLXSidebar-macos26-arm64
          path: OMLXSidebar.milkext.zip
          if-no-files-found: error
          retention-days: 14
